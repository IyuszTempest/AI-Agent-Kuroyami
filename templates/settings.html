<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuroyami Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Quicksand", sans-serif;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body
    id="body-main"
    class="bg-white h-screen w-screen flex justify-center items-center m-0 p-0 overflow-hidden transition-colors duration-300"
  >
    <!-- Container Full Screen Sesuai Jendela -->
    <div
      id="main-container"
      class="relative w-full h-full flex flex-col justify-between bg-white overflow-hidden p-8 md:p-16 transition-colors duration-300"
    >
      <!-- Header Settings -->
      <div class="w-full max-w-2xl mx-auto pt-4">
        <h1
          id="settings-title"
          class="text-2xl font-bold text-gray-900 text-center mb-10 tracking-tight transition-colors duration-300"
        >
          Settings
        </h1>

        <!-- Opsi Pengaturan -->
        <div
          id="settings-card"
          class="space-y-6 bg-gray-50/60 p-6 rounded-2xl border border-gray-100 shadow-sm transition-colors duration-300"
        >
          <!-- Tema Gelap -->
          <div class="flex items-center justify-between py-2" id="theme-row">
            <span
              id="label-theme"
              class="text-xs font-bold text-gray-800 tracking-wide transition-colors duration-300"
              >Tema Gelap</span
            >
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="theme-toggle" class="sr-only peer" />
              <div
                class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-black"
              ></div>
            </label>
          </div>
        </div>
      </div>
      <div class="flex-1"></div>
      <div
        class="w-full max-w-2xl mx-auto flex items-center justify-end space-x-4 pb-4"
      >
        <button
          onclick="goBack()"
          class="text-xs font-bold text-red-600 hover:text-red-700 transition px-2 py-1"
        >
          Batal
        </button>
        <button
          onclick="saveSettings()"
          class="bg-black hover:bg-gray-800 text-white text-xs font-bold py-2.5 px-6 rounded-full shadow-lg transition"
          id="save-btn"
        >
          Simpan
        </button>
      </div>
    </div>

    <!-- Script Interaksi -->
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const bodyMain = document.getElementById("body-main");
      const mainContainer = document.getElementById("main-container");
      const settingsCard = document.getElementById("settings-card");
      const settingsTitle = document.getElementById("settings-title");
      const labelTheme = document.getElementById("label-theme");
      const themeRow = document.getElementById("theme-row");
      const saveBtn = document.getElementById("save-btn");

      function applyTheme(isDark) {
        if (isDark) {
          bodyMain.className =
            "bg-gray-900 h-screen w-screen flex justify-center items-center m-0 p-0 overflow-hidden transition-colors duration-300";
          mainContainer.className =
            "relative w-full h-full flex flex-col justify-between bg-gray-900 overflow-hidden p-8 md:p-16 transition-colors duration-300";
          settingsCard.className =
            "space-y-6 bg-gray-800/80 p-6 rounded-2xl border border-gray-700 shadow-sm transition-colors duration-300";
          settingsTitle.className =
            "text-2xl font-bold text-white text-center mb-10 tracking-tight transition-colors duration-300";
          labelTheme.className =
            "text-xs font-bold text-gray-200 tracking-wide transition-colors duration-300";
          themeRow.className = "flex items-center justify-between py-2";
          saveBtn.className =
            "bg-white hover:bg-gray-200 text-black text-xs font-bold py-2.5 px-6 rounded-full shadow-lg transition";
        } else {
          bodyMain.className =
            "bg-white h-screen w-screen flex justify-center items-center m-0 p-0 overflow-hidden transition-colors duration-300";
          mainContainer.className =
            "relative w-full h-full flex flex-col justify-between bg-white overflow-hidden p-8 md:p-16 transition-colors duration-300";
          settingsCard.className =
            "space-y-6 bg-gray-50/60 p-6 rounded-2xl border border-gray-100 shadow-sm transition-colors duration-300";
          settingsTitle.className =
            "text-2xl font-bold text-gray-900 text-center mb-10 tracking-tight transition-colors duration-300";
          labelTheme.className =
            "text-xs font-bold text-gray-800 tracking-wide transition-colors duration-300";
          themeRow.className = "flex items-center justify-between py-2";
          saveBtn.className =
            "bg-black hover:bg-gray-800 text-white text-xs font-bold py-2.5 px-6 rounded-full shadow-lg transition";
        }
      }

      themeToggle.addEventListener("change", function () {
        applyTheme(this.checked);
      });

      window.addEventListener("DOMContentLoaded", async () => {
        try {
          let res = await fetch("/get-settings");
          if (res.ok) {
            let data = await res.json();
            document.getElementById("theme-toggle").checked =
              data.tema_gelap ?? false;
            applyTheme(data.tema_gelap ?? false);
          }
        } catch (err) {
          console.log("Memuat dari localStorage cadangan...");
          const savedTheme = localStorage.getItem("tema_gelap") === "true";
          document.getElementById("theme-toggle").checked = savedTheme;
          applyTheme(savedTheme);
        }
      });

      function goBack() {
        window.location.href = "/";
      }

      async function saveSettings() {
        const temaGelap = document.getElementById("theme-toggle").checked;

        const settingsData = {
          tema_gelap: temaGelap,
        };

        localStorage.setItem("tema_gelap", temaGelap);

        try {
          let response = await fetch("/save-settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(settingsData),
          });

          if (response.ok) {
            alert("Pengaturan berhasil disimpan!");
            goBack();
          } else {
            alert("Gagal menyimpan pengaturan ke server.");
          }
        } catch (e) {
          console.error("Error:", e);
          alert("Pengaturan tersimpan secara lokal!");
          goBack();
        }
      }
    </script>
  </body>
</html>
